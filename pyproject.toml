[project]
name = "intent-gate-mcp"
version = "0.10.0"
description = "Lightweight intent-alignment plugin for coding agents: requirement-analysis playbook, three-level intent funnel with file-in-the-loop persistence, optional red-blue review skill (DingTalk group channel lives in the intent-gate-service sister service)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "baixinghao" },
]
keywords = ["mcp", "intent-alignment", "human-in-the-loop", "requirement-analysis", "red-blue-review", "claude-code-plugin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # FastMCP API 是 1.x 世代的接口；mcp 2.0 已将其移除（拆分为独立 fastmcp 包），
    # 本项目代码按 1.x API 编写，钉住上界防止 pip 装上不兼容的 2.x。
    "mcp>=1.10.0,<2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # docx 支持（主力战场：需求文档多为 Word）。mammoth 纯 Python 轻量
    # （唯一依赖 cobble，无 onnxruntime），硬依赖——pipx/pip 安装时自动带上；
    # 用户环境已有 markitdown 时自动复用增强（表格/合并单元格），无则走 mammoth。
    "mammoth>=1.11.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
intent-gate = "intent_gate.__main__:main"

[project.urls]
Homepage = "https://github.com/baixinghao/intent-gate"
Repository = "https://github.com/baixinghao/intent-gate"
Issues = "https://github.com/baixinghao/intent-gate/issues"
"DingTalk sister service" = "https://github.com/baixinghao/intent-gate-service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_gate"]

# using-intent-gate 纪律文本的单一事实源在 skills/；wheel 经 force-include 携带，
# 供 `intent-gate hook session-start`（install --target 的配套）在无插件目录的
# agent（Cursor/Codex…）里读取。禁止在包内手抄第二份。
# DSH 安装器（install --target dsh）从这些 _assets 读 skill 文本，
# 复制到 $DSH_HOME/skills/ 供 DeepSeek Harness 的 skill 发现机制加载。
[tool.hatch.build.targets.wheel.force-include]
"skills/using-intent-gate/SKILL.md" = "intent_gate/_assets/using-intent-gate.SKILL.md"
# DSH 安装器按 _assets/skills/<name>/SKILL.md 布局读取；整目录映射一次携带全部 skill
"skills" = "intent_gate/_assets/skills"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
